name: Sync with Upstream

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Fetch official repository
        run: |
          git remote add upstream https://github.com/LNReader/lnreader-plugins.git
          git fetch upstream master

      - name: Configure git identity        # <-- new step
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge upstream changes
        id: merge
        shell: bash
        run: |
          set -euo pipefail

          OLD_SHA=$(git rev-parse HEAD)

          git merge upstream/master --no-edit

          NEW_SHA=$(git rev-parse HEAD)

          echo "old_sha=$OLD_SHA" >> "$GITHUB_OUTPUT"
          echo "new_sha=$NEW_SHA" >> "$GITHUB_OUTPUT"

          if [ "$OLD_SHA" = "$NEW_SHA" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Upstream changes merged."
          fi

      - name: Push changes to my fork
        if: steps.merge.outputs.changed == 'true'
        run: git push origin master

      - name: Check for plugin changes
        if: steps.merge.outputs.changed == 'true'
        id: plugins
        run: |
          if git diff --quiet \
            "${{ steps.merge.outputs.old_sha }}" \
            "${{ steps.merge.outputs.new_sha }}" \
            -- plugins/ public/ scripts/publish-plugins.sh \
            .github/workflows/publish-plugins.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger plugin publishing
        if: steps.plugins.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish-plugins.yml --ref master
